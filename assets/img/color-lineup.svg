<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="colTitle colDesc">
  <title id="colTitle">遠近両用カラーコンタクトのカラーバリエーション</title>
  <desc id="colDesc">ナチュラルブラウン、オリーブ、グレージュ、ブラックの4色の瞳のイメージ</desc>
  <defs>
    <radialGradient id="cBrown" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4A2A18"/><stop offset="52%" stop-color="#8A5A34"/><stop offset="100%" stop-color="#5E3A20"/>
    </radialGradient>
    <radialGradient id="cOlive" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3A3520"/><stop offset="52%" stop-color="#8B8A55"/><stop offset="100%" stop-color="#5A5730"/>
    </radialGradient>
    <radialGradient id="cGreige" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3E3A36"/><stop offset="52%" stop-color="#A2968C"/><stop offset="100%" stop-color="#6E625A"/>
    </radialGradient>
    <radialGradient id="cBlack" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14161A"/><stop offset="52%" stop-color="#3B4149"/><stop offset="100%" stop-color="#1C2026"/>
    </radialGradient>
    <linearGradient id="cWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#EDF3F7"/>
    </linearGradient>
    <filter id="cShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0A3A5C" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="1000" height="300" fill="#FFFFFF"/>

  <g font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" text-anchor="middle">
    <!-- 目を4つ並べる -->
    <g transform="translate(135 130)">
      <g filter="url(#cShadow)">
        <path d="M-104 0c30-44 70-66 104-66s74 22 104 66c-30 44-70 66-104 66S-74 44-104 0z" fill="url(#cWhite)"/>
      </g>
      <clipPath id="clipA"><path d="M-104 0c30-44 70-66 104-66s74 22 104 66c-30 44-70 66-104 66S-74 44-104 0z"/></clipPath>
      <g clip-path="url(#clipA)">
        <circle r="52" fill="url(#cBrown)"/>
        <circle r="52" fill="none" stroke="#2E1A0E" stroke-width="7" opacity=".55"/>
        <circle r="20" fill="#161009"/>
        <circle cx="-18" cy="-20" r="11" fill="#FFFFFF" opacity=".9"/>
        <circle cx="14" cy="16" r="5" fill="#FFFFFF" opacity=".55"/>
      </g>
      <path d="M-104 0c30-44 70-66 104-66s74 22 104 66" fill="none" stroke="#3A2A22" stroke-width="6" stroke-linecap="round"/>
      <text y="112" font-size="19" font-weight="700" fill="#0A3A5C">ナチュラルブラウン</text>
      <text y="136" font-size="14" fill="#6B7C89">いつもの瞳をひとまわり大きく</text>
    </g>

    <g transform="translate(385 130)">
      <g filter="url(#cShadow)">
        <path d="M-104 0c30-44 70-66 104-66s74 22 104 66c-30 44-70 66-104 66S-74 44-104 0z" fill="url(#cWhite)"/>
      </g>
      <clipPath id="clipB"><path d="M-104 0c30-44 70-66 104-66s74 22 104 66c-30 44-70 66-104 66S-74 44-104 0z"/></clipPath>
      <g clip-path="url(#clipB)">
        <circle r="52" fill="url(#cOlive)"/>
        <circle r="52" fill="none" stroke="#31301A" stroke-width="7" opacity=".55"/>
        <circle r="20" fill="#171509"/>
        <circle cx="-18" cy="-20" r="11" fill="#FFFFFF" opacity=".9"/>
        <circle cx="14" cy="16" r="5" fill="#FFFFFF" opacity=".55"/>
      </g>
      <path d="M-104 0c30-44 70-66 104-66s74 22 104 66" fill="none" stroke="#3A2A22" stroke-width="6" stroke-linecap="round"/>
      <text y="112" font-size="19" font-weight="700" fill="#0A3A5C">オリーブ</text>
      <text y="136" font-size="14" fill="#6B7C89">光の下で軽やかに、知的な印象へ</text>
    </g>

    <g transform="translate(635 130)">
      <g filter="url(#cShadow)">
        <path d="M-104 0c30-44 70-66 104-66s74 22 104 66c-30 44-70 66-104 66S-74 44-104 0z" fill="url(#cWhite)"/>
      </g>
      <clipPath id="clipC"><path d="M-104 0c30-44 70-66 104-66s74 22 104 66c-30 44-70 66-104 66S-74 44-104 0z"/></clipPath>
      <g clip-path="url(#clipC)">
        <circle r="52" fill="url(#cGreige)"/>
        <circle r="52" fill="none" stroke="#4A423C" stroke-width="7" opacity=".5"/>
        <circle r="20" fill="#1B1815"/>
        <circle cx="-18" cy="-20" r="11" fill="#FFFFFF" opacity=".9"/>
        <circle cx="14" cy="16" r="5" fill="#FFFFFF" opacity=".55"/>
      </g>
      <path d="M-104 0c30-44 70-66 104-66s74 22 104 66" fill="none" stroke="#3A2A22" stroke-width="6" stroke-linecap="round"/>
      <text y="112" font-size="19" font-weight="700" fill="#0A3A5C">グレージュ</text>
      <text y="136" font-size="14" fill="#6B7C89">白髪・グレイヘアにもなじむ透明感</text>
    </g>

    <g transform="translate(885 130)">
      <g filter="url(#cShadow)">
        <path d="M-104 0c30-44 70-66 104-66s74 22 104 66c-30 44-70 66-104 66S-74 44-104 0z" fill="url(#cWhite)"/>
      </g>
      <clipPath id="clipD"><path d="M-104 0c30-44 70-66 104-66s74 22 104 66c-30 44-70 66-104 66S-74 44-104 0z"/></clipPath>
      <g clip-path="url(#clipD)">
        <circle r="52" fill="url(#cBlack)"/>
        <circle r="52" fill="none" stroke="#0F1114" stroke-width="7" opacity=".6"/>
        <circle r="20" fill="#0B0D10"/>
        <circle cx="-18" cy="-20" r="11" fill="#FFFFFF" opacity=".9"/>
        <circle cx="14" cy="16" r="5" fill="#FFFFFF" opacity=".55"/>
      </g>
      <path d="M-104 0c30-44 70-66 104-66s74 22 104 66" fill="none" stroke="#3A2A22" stroke-width="6" stroke-linecap="round"/>
      <text y="112" font-size="19" font-weight="700" fill="#0A3A5C">ブラック</text>
      <text y="136" font-size="14" fill="#6B7C89">裸眼のような自然な引き締め</text>
    </g>

  </g>
</svg>
