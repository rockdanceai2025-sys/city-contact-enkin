<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="frTitle frDesc">
  <title id="frTitle">ピントが合う範囲の変化</title>
  <desc id="frDesc">以前は手元から遠くまでピントが合っていたのに対し、40代以降は手元側のピントが合いにくくなることを距離の帯で示した図</desc>
  <defs>
    <linearGradient id="frOk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F292AF"/><stop offset="100%" stop-color="#E4638A"/>
    </linearGradient>
    <linearGradient id="frNg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DED5D8"/><stop offset="55%" stop-color="#E9E0E3"/><stop offset="100%" stop-color="#E4638A"/>
    </linearGradient>
  </defs>

  <rect width="900" height="420" fill="#FFFFFF"/>

  <g font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">
    <!-- 距離の目盛り -->
    <g font-size="14" fill="#8A7C82" text-anchor="middle">
      <text x="150" y="60">30cm（手元）</text>
      <text x="360" y="60">1m</text>
      <text x="570" y="60">3m</text>
      <text x="790" y="60">遠く</text>
    </g>
    <g stroke="#F0E3E8" stroke-width="2" stroke-dasharray="4 6">
      <line x1="150" y1="72" x2="150" y2="330"/>
      <line x1="360" y1="72" x2="360" y2="330"/>
      <line x1="570" y1="72" x2="570" y2="330"/>
      <line x1="790" y1="72" x2="790" y2="330"/>
    </g>

    <!-- 以前 -->
    <text x="70" y="128" font-size="17" font-weight="700" fill="#5C4A52" text-anchor="end">以前</text>
    <rect x="100" y="100" width="740" height="46" rx="23" fill="url(#frOk)"/>
    <text x="470" y="130" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">手元から遠くまで、ピントが合う</text>

    <!-- 40代から -->
    <text x="70" y="228" font-size="17" font-weight="700" fill="#5C4A52" text-anchor="end">40代から</text>
    <rect x="100" y="200" width="740" height="46" rx="23" fill="url(#frNg)"/>
    <text x="255" y="230" font-size="16" font-weight="700" fill="#8A7C82" text-anchor="middle">合いにくくなる</text>
    <text x="650" y="230" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">遠くは変わらず見える</text>

    <!-- 遠近両用レンズ -->
    <text x="70" y="328" font-size="17" font-weight="700" fill="#C2456C" text-anchor="end">遠近両用</text>
    <rect x="100" y="300" width="740" height="46" rx="23" fill="url(#frOk)"/>
    <text x="470" y="330" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1枚で、もう一度ぜんぶの距離へ</text>

    <text x="450" y="392" font-size="14" fill="#A2949A" text-anchor="middle">※ 図はイメージです。ピントが合う範囲や見え方には個人差があります。</text>
  </g>
</svg>
