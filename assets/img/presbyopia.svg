<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-labelledby="preTitle preDesc">
  <title id="preTitle">老視（老眼）が起こる仕組み</title>
  <desc id="preDesc">若い頃は水晶体が厚くなってピントを合わせられるが、加齢により水晶体が硬くなり、近くにピントが合いにくくなる様子の比較図</desc>
  <defs>
    <linearGradient id="pEye" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#E8F3FA"/>
    </linearGradient>
    <linearGradient id="pLensSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16B8C8"/><stop offset="100%" stop-color="#9BE7EE"/>
    </linearGradient>
    <linearGradient id="pLensHard" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8FA3B2"/><stop offset="100%" stop-color="#C9D6DE"/>
    </linearGradient>
    <filter id="pShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0A3A5C" flood-opacity=".14"/>
    </filter>
  </defs>

  <rect width="900" height="480" fill="#FFFFFF"/>

  <g font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">
    <!-- 若い頃 -->
    <g transform="translate(40 60)">
      <rect x="0" y="0" width="380" height="360" rx="18" fill="#F5FAFD"/>
      <text x="190" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#0E6FB8">若い頃の目</text>
      <g transform="translate(190 190)" filter="url(#pShadow)">
        <ellipse rx="120" ry="106" fill="url(#pEye)" stroke="#CFE3EF" stroke-width="3"/>
        <path d="M-120 0a120 106 0 0 1 42-80l0 160a120 106 0 0 1-42-80z" fill="#DCEEF7" opacity=".7"/>
        <!-- 水晶体：厚くなる -->
        <ellipse cx="-58" cy="0" rx="26" ry="52" fill="url(#pLensSoft)" opacity=".95"/>
        <!-- 光線がぴったり網膜へ -->
        <path d="M-150 -46 L-58 -20 L118 0" fill="none" stroke="#16B8C8" stroke-width="3"/>
        <path d="M-150 46 L-58 20 L118 0" fill="none" stroke="#16B8C8" stroke-width="3"/>
        <circle cx="118" cy="0" r="7" fill="#16B8C8"/>
      </g>
      <text x="190" y="330" text-anchor="middle" font-size="16" fill="#4A6274">水晶体がやわらかく、厚みを変えて</text>
      <text x="190" y="352" text-anchor="middle" font-size="16" fill="#4A6274">近くにもすっとピントが合う</text>
    </g>

    <!-- 40代以降 -->
    <g transform="translate(480 60)">
      <rect x="0" y="0" width="380" height="360" rx="18" fill="#FDF6F1"/>
      <text x="190" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#C97A4B">40代からの目</text>
      <g transform="translate(190 190)" filter="url(#pShadow)">
        <ellipse rx="120" ry="106" fill="url(#pEye)" stroke="#E8D8CC" stroke-width="3"/>
        <path d="M-120 0a120 106 0 0 1 42-80l0 160a120 106 0 0 1-42-80z" fill="#F2E4D9" opacity=".7"/>
        <!-- 水晶体：硬く薄いまま -->
        <ellipse cx="-58" cy="0" rx="16" ry="52" fill="url(#pLensHard)" opacity=".95"/>
        <!-- 焦点が網膜の後ろに -->
        <path d="M-150 -46 L-58 -26 L118 12" fill="none" stroke="#C97A4B" stroke-width="3"/>
        <path d="M-150 46 L-58 26 L118 -12" fill="none" stroke="#C97A4B" stroke-width="3"/>
        <circle cx="118" cy="12" r="5" fill="#C97A4B" opacity=".5"/>
        <circle cx="118" cy="-12" r="5" fill="#C97A4B" opacity=".5"/>
        <text x="60" y="-56" font-size="15" fill="#C97A4B">ピントが合いきらない</text>
      </g>
      <text x="190" y="330" text-anchor="middle" font-size="16" fill="#4A6274">水晶体が硬くなり厚みを変えにくく、</text>
      <text x="190" y="352" text-anchor="middle" font-size="16" fill="#4A6274">手元がぼやけて見える</text>
    </g>

    <text x="450" y="462" text-anchor="middle" font-size="14" fill="#8497A5">※図はイメージです。見え方には個人差があります。</text>
  </g>
</svg>
