<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="clnTitle clnDesc">
  <title id="clnTitle">遠近両用カラーレンズのカラーバリエーション</title>
  <desc id="clnDesc">ブラウン、オリーブ、グレージュ、ブラックの4色のレンズそのもののイメージ</desc>
  <defs>
    <radialGradient id="lnBase" cx="42%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#F7F7F7"/>
    </radialGradient>
    <linearGradient id="lnBrown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9A6A3E"/><stop offset="100%" stop-color="#6B4526"/>
    </linearGradient>
    <linearGradient id="lnOlive" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9A9A64"/><stop offset="100%" stop-color="#5F5E35"/>
    </linearGradient>
    <linearGradient id="lnGreige" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B0A49A"/><stop offset="100%" stop-color="#7B6F66"/>
    </linearGradient>
    <linearGradient id="lnBlack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A5058"/><stop offset="100%" stop-color="#20242A"/>
    </linearGradient>
    <filter id="lnShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#717171" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect width="1000" height="300" fill="#FFFFFF"/>

  <g font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" text-anchor="middle">
    <!-- レンズ1 -->
    <g transform="translate(135 120)">
      <g><circle r="76" fill="url(#lnBase)"/></g>
      <circle r="76" fill="none" stroke="#ECECEC" stroke-width="2"/>
      <circle r="62" fill="none" stroke="url(#lnBrown)" stroke-width="22" opacity=".92"/>
      <circle r="50" fill="none" stroke="#FFFFFF" stroke-width="2" opacity=".5"/>
      <path d="M-46-38a62 62 0 0 1 34-24" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" opacity=".9"/>
      <text y="112" font-size="19" font-weight="700" fill="#4E4E4E">ブラウン</text>
      <text y="136" font-size="14" fill="#7F7F7F">いちばん自然になじむ定番</text>
    </g>

    <!-- レンズ2 -->
    <g transform="translate(385 120)">
      <g><circle r="76" fill="url(#lnBase)"/></g>
      <circle r="76" fill="none" stroke="#ECECEC" stroke-width="2"/>
      <circle r="62" fill="none" stroke="url(#lnOlive)" stroke-width="22" opacity=".92"/>
      <circle r="50" fill="none" stroke="#FFFFFF" stroke-width="2" opacity=".5"/>
      <path d="M-46-38a62 62 0 0 1 34-24" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" opacity=".9"/>
      <text y="112" font-size="19" font-weight="700" fill="#4E4E4E">オリーブ</text>
      <text y="136" font-size="14" fill="#7F7F7F">光の下で軽やかに、知的な印象へ</text>
    </g>

    <!-- レンズ3 -->
    <g transform="translate(635 120)">
      <g><circle r="76" fill="url(#lnBase)"/></g>
      <circle r="76" fill="none" stroke="#ECECEC" stroke-width="2"/>
      <circle r="62" fill="none" stroke="url(#lnGreige)" stroke-width="22" opacity=".92"/>
      <circle r="50" fill="none" stroke="#FFFFFF" stroke-width="2" opacity=".5"/>
      <path d="M-46-38a62 62 0 0 1 34-24" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" opacity=".9"/>
      <text y="112" font-size="19" font-weight="700" fill="#4E4E4E">グレージュ</text>
      <text y="136" font-size="14" fill="#7F7F7F">グレイヘアにもなじむ透明感</text>
    </g>

    <!-- レンズ4 -->
    <g transform="translate(885 120)">
      <g><circle r="76" fill="url(#lnBase)"/></g>
      <circle r="76" fill="none" stroke="#ECECEC" stroke-width="2"/>
      <circle r="62" fill="none" stroke="url(#lnBlack)" stroke-width="22" opacity=".92"/>
      <circle r="50" fill="none" stroke="#FFFFFF" stroke-width="2" opacity=".5"/>
      <path d="M-46-38a62 62 0 0 1 34-24" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" opacity=".9"/>
      <text y="112" font-size="19" font-weight="700" fill="#4E4E4E">ブラック</text>
      <text y="136" font-size="14" fill="#7F7F7F">裸眼のような自然な引き締め</text>
    </g>
  </g>
</svg>
