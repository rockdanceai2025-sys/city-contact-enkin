<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="大人の瞳を快適に。全店眼科併設で安心の遠近両用レンズ｜シティコンタクト">
  <rect width="1200" height="630" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#0000001a" stroke-width="2"/>

  <!-- 右：レンズのモチーフ（グラファイトの線のみ・影なし） -->
  <g transform="translate(960 315)">
    <circle r="230" fill="#F9F9F9"/>
    <circle r="230" fill="none" stroke="#0000001a" stroke-width="2"/>
    <circle r="176" fill="none" stroke="#0D0D0D" stroke-width="2"/>
    <circle r="120" fill="none" stroke="#5D5D5D" stroke-width="2"/>
    <circle r="64" fill="none" stroke="#8F8F8F" stroke-width="2"/>
    <circle r="10" fill="#0D0D0D"/>
  </g>

  <g font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif">
    <text x="90" y="196" font-size="24" font-weight="500" fill="#8F8F8F" letter-spacing="6">CITY CONTACT ／ 遠近両用レンズ特集</text>
    <text x="90" y="300" font-size="58" font-weight="600" fill="#0D0D0D">大人の瞳を快適に。</text>
    <text x="90" y="378" font-size="58" font-weight="600" fill="#0D0D0D">全店眼科併設で安心。</text>
    <rect x="90" y="424" width="1020" height="1" fill="#0000001a"/>
    <text x="90" y="482" font-size="26" font-weight="400" fill="#5D5D5D">遠近両用レンズ ／ 熟年世代向け遠近両用カラコン</text>
    <text x="90" y="550" font-size="26" font-weight="600" fill="#0D0D0D">シティコンタクト</text>
  </g>
</svg>
