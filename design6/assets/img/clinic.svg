<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="clTitle clDesc">
  <title id="clTitle">全店眼科併設だから実現する安心の処方フロー</title>
  <desc id="clDesc">併設の眼科で医師の診察と処方を受け、その処方をもとにシティコンタクト店舗でレンズを選べる流れの図</desc>
  <defs>
    <linearGradient id="clHos" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#AEAEAE"/><stop offset="100%" stop-color="#BEBEBE"/>
    </linearGradient>
    <linearGradient id="clShop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#727272"/><stop offset="100%" stop-color="#8E8E8E"/>
    </linearGradient>
    <filter id="clShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#797979" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect width="960" height="440" fill="#F9F9F9"/>

  <g font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">
    <!-- 眼科 -->
    <g filter="url(#clShadow)">
      <rect x="60" y="120" width="330" height="230" rx="20" fill="#FFFFFF"/>
      <path d="M60 140a20 20 0 0 1 20-20h290a20 20 0 0 1 20 20v46H60z" fill="url(#clHos)"/>
    </g>
    <text x="225" y="163" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">併設の眼科</text>
    <!-- 医師 -->
    <g transform="translate(150 252)">
      <path d="M-30 46c0-24 13-40 30-40s30 16 30 40z" fill="#FFFFFF" stroke="#DADADA" stroke-width="3"/>
      <circle cy="-16" r="26" fill="#E2E2E2"/>
      <path d="M-27-22a27 22 0 0 1 54 0l-6 4a22 16 0 0 0-42 0z" fill="#484848"/>
      <circle cx="-8" cy="-16" r="3" fill="#363636"/><circle cx="8" cy="-16" r="3" fill="#363636"/>
      <path d="M-7 -4a7 7 0 0 0 14 0" fill="none" stroke="#909090" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M-8 14v22M8 14v22" stroke="#AEAEAE" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g font-size="15" fill="#636363">
      <text x="205" y="238">医師が目の状態を診察</text>
      <text x="205" y="264">涙の量・角膜の状態を確認</text>
      <text x="205" y="290">度数・ADD（加入度数）を処方</text>
    </g>
    <g fill="#AEAEAE">
      <circle cx="193" cy="233" r="4"/><circle cx="193" cy="259" r="4"/><circle cx="193" cy="285" r="4"/>
    </g>

    <!-- 矢印 -->
    <g transform="translate(430 235)">
      <path d="M0 0h70" stroke="#8E8E8E" stroke-width="6" stroke-linecap="round"/>
      <path d="M62 -12l20 12-20 12z" fill="#8E8E8E"/>
      <text x="42" y="-26" text-anchor="middle" font-size="14" font-weight="700" fill="#727272">処方せん</text>
      <text x="42" y="44" text-anchor="middle" font-size="13" fill="#808080">その場でご来店</text>
    </g>

    <!-- 店舗 -->
    <g filter="url(#clShadow)">
      <rect x="570" y="120" width="330" height="230" rx="20" fill="#FFFFFF"/>
      <path d="M570 140a20 20 0 0 1 20-20h290a20 20 0 0 1 20 20v46H570z" fill="url(#clShop)"/>
    </g>
    <text x="735" y="163" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">シティコンタクト</text>
    <!-- スタッフ -->
    <g transform="translate(660 252)">
      <path d="M-30 46c0-24 13-40 30-40s30 16 30 40z" fill="#F2F2F2" stroke="#D4D4D4" stroke-width="3"/>
      <circle cy="-16" r="26" fill="#E2E2E2"/>
      <path d="M-28-20a28 24 0 0 1 56 0c0 14-6 4-10 2-10 6-30 6-40-2-4 4-6 12-6-0z" fill="#393939"/>
      <circle cx="-8" cy="-16" r="3" fill="#363636"/><circle cx="8" cy="-16" r="3" fill="#363636"/>
      <path d="M-7 -4a7 7 0 0 0 14 0" fill="none" stroke="#909090" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="0" cy="24" r="9" fill="none" stroke="#8E8E8E" stroke-width="3"/>
    </g>
    <g font-size="15" fill="#636363">
      <text x="715" y="238">処方にもとづきレンズを選定</text>
      <text x="715" y="264">お試しフィッティング</text>
      <text x="715" y="290">定額制プランで定期検査へ</text>
    </g>
    <g fill="#8E8E8E">
      <circle cx="703" cy="233" r="4"/><circle cx="703" cy="259" r="4"/><circle cx="703" cy="285" r="4"/>
    </g>

    <text x="480" y="66" text-anchor="middle" font-size="26" font-weight="700" fill="#727272">診察から処方、レンズ選びまで、ひとつづきに。</text>
    <text x="480" y="400" text-anchor="middle" font-size="14" fill="#989898">※ 眼科の診療日・診療時間は店舗により異なります。詳しくは各店舗ページをご確認ください。</text>
  </g>
</svg>
