<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-label="想い出の品をやさしく整理するイメージ">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#fdf7ee"/>
      <stop offset="1" stop-color="#f6efe3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#fbeacf" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#fbeacf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98d51"/>
      <stop offset="1" stop-color="#a96e39"/>
    </linearGradient>
    <linearGradient id="boxlid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dda468"/>
      <stop offset="1" stop-color="#c2864b"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe6bd" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffe6bd" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round"><rect x="0" y="0" width="760" height="600" rx="40"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="760" height="600" fill="url(#bg)"/>

    <!-- 窓からの光 -->
    <g opacity="0.75">
      <path d="M120 0 L250 0 L200 600 L40 600 Z" fill="url(#ray)"/>
      <path d="M300 0 L360 0 L336 600 L258 600 Z" fill="url(#ray)" opacity="0.6"/>
      <path d="M560 0 L660 0 L700 600 L580 600 Z" fill="url(#ray)" opacity="0.5"/>
    </g>

    <!-- 中央のやわらかな光 -->
    <ellipse cx="380" cy="252" rx="300" ry="230" fill="url(#glow)"/>

    <!-- 舞う光の粒 -->
    <g fill="#e8b874" opacity="0.55">
      <circle cx="176" cy="120" r="5"/><circle cx="236" cy="86" r="3"/>
      <circle cx="604" cy="140" r="6"/><circle cx="556" cy="92" r="3.4"/>
      <circle cx="126" cy="252" r="3.6"/><circle cx="648" cy="252" r="4.4"/>
      <circle cx="300" cy="58" r="3"/><circle cx="470" cy="64" r="4"/>
    </g>

    <!-- 想い出の品（箱から立ちのぼるように配置） -->
    <!-- 手紙 -->
    <g transform="translate(178 196) rotate(-11)">
      <rect x="0" y="0" width="118" height="82" rx="7" fill="#ffffff" stroke="#e3d7c4" stroke-width="2.5"/>
      <path d="M4 8 L59 48 L114 8" fill="none" stroke="#dcc7a8" stroke-width="3" stroke-linecap="round"/>
      <rect x="18" y="60" width="52" height="4.5" rx="2.2" fill="#efe3d0"/>
    </g>

    <!-- 懐中時計 -->
    <g transform="translate(516 178) rotate(9)">
      <circle cx="52" cy="56" r="42" fill="#ffffff" stroke="#c98d51" stroke-width="5"/>
      <circle cx="52" cy="56" r="32" fill="#fdf6ea"/>
      <path d="M52 8 v-9" stroke="#c98d51" stroke-width="6" stroke-linecap="round"/>
      <path d="M52 56 V36 M52 56 L66 64" stroke="#23415f" stroke-width="4" stroke-linecap="round"/>
      <circle cx="52" cy="56" r="3.4" fill="#23415f"/>
    </g>

    <!-- 湯のみ -->
    <g transform="translate(596 300)">
      <path d="M6 6 h68 l-8 58 a16 16 0 0 1 -16 14 h-20 a16 16 0 0 1 -16 -14 Z" fill="#ffffff" stroke="#d9cbb5" stroke-width="3"/>
      <path d="M14 22 h52" stroke="#a8c3d8" stroke-width="4" stroke-linecap="round"/>
      <g stroke="#e0d2bc" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9">
        <path d="M28 -8 c6 -8 -6 -14 0 -22"/>
        <path d="M50 -8 c6 -8 -6 -14 0 -22"/>
      </g>
    </g>

    <!-- 写真立て（主役） -->
    <g transform="translate(300 118)">
      <rect x="0" y="0" width="176" height="196" rx="12" fill="#ffffff" stroke="#c98d51" stroke-width="7"/>
      <rect x="17" y="17" width="142" height="140" rx="6" fill="#eef3f8"/>
      <!-- 写真の中の家族 -->
      <circle cx="66" cy="74" r="21" fill="#a9c1d6"/>
      <path d="M36 128 a30 30 0 0 1 60 0 z" fill="#a9c1d6"/>
      <circle cx="115" cy="82" r="16" fill="#e0a869"/>
      <path d="M92 128 a23 23 0 0 1 46 0 z" fill="#e0a869"/>
      <path d="M17 128 h142 v29 H17 z" fill="#dbe6ef"/>
      <rect x="46" y="171" width="84" height="6" rx="3" fill="#f0e3d0"/>
    </g>

    <!-- 桜の花びら -->
    <g fill="#f4c9c0" opacity="0.85">
      <path d="M462 356 c10 -14 26 -10 24 4 c-2 12 -18 18 -26 10 z"/>
      <path d="M258 344 c-11 -13 -27 -8 -24 6 c3 12 19 16 26 8 z"/>
      <path d="M676 420 c9 -12 23 -9 21 4 c-2 10 -16 15 -23 8 z" opacity="0.7"/>
    </g>

    <!-- 想い出箱 -->
    <g transform="translate(212 330)">
      <!-- ふた -->
      <g transform="translate(-24 -26) rotate(-8)">
        <rect x="0" y="0" width="180" height="34" rx="9" fill="url(#boxlid)"/>
        <rect x="0" y="0" width="180" height="12" rx="6" fill="#e7b77c" opacity="0.75"/>
      </g>
      <!-- 本体 -->
      <rect x="0" y="16" width="336" height="150" rx="14" fill="url(#box)"/>
      <rect x="0" y="16" width="336" height="26" rx="13" fill="#dda468" opacity="0.55"/>
      <rect x="140" y="16" width="56" height="150" fill="#e9c495" opacity="0.5"/>
      <rect x="152" y="72" width="32" height="34" rx="7" fill="#fdf6ea" opacity="0.9"/>
      <circle cx="168" cy="89" r="6" fill="#a96e39"/>
    </g>

    <!-- 台と影 -->
    <ellipse cx="380" cy="512" rx="272" ry="26" fill="#e6d8c2" opacity="0.6"/>
    <rect x="60" y="512" width="640" height="14" rx="7" fill="#e3d3ba"/>

  </g>
</svg>
