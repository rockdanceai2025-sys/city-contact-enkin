<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#fdf8f0"/><stop offset="1" stop-color="#f3ead9"/>
    </linearGradient>
    <linearGradient id="og-ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe6bd" stop-opacity="0.9"/><stop offset="1" stop-color="#ffe6bd" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <path d="M820 0 L960 0 L1060 630 L840 630 Z" fill="url(#og-ray)"/>
  <path d="M1020 0 L1100 0 L1200 630 L1120 630 Z" fill="url(#og-ray)" opacity="0.6"/>

  <rect x="0" y="0" width="1200" height="14" fill="#23415f"/>

  <g transform="translate(88 132)">
    <rect x="0" y="0" width="230" height="46" rx="23" fill="#23415f"/>
    <text x="115" y="31" font-family="'Noto Sans JP',sans-serif" font-size="21" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">福岡県全域 対応</text>
  </g>

  <text x="88" y="286" font-family="'Noto Serif JP',serif" font-size="66" font-weight="bold" fill="#17304a" letter-spacing="1">想い出を、</text>
  <text x="88" y="374" font-family="'Noto Serif JP',serif" font-size="66" font-weight="bold" fill="#17304a" letter-spacing="1">ただのゴミには</text>
  <text x="88" y="462" font-family="'Noto Serif JP',serif" font-size="66" font-weight="bold" fill="#17304a" letter-spacing="1">いたしません。</text>

  <text x="90" y="524" font-family="'Noto Sans JP',sans-serif" font-size="25" fill="#6e675e">実家じまい・遺品整理　｜　供養・高価買取までワンストップ</text>

  <g transform="translate(84 552)">
    <rect x="0" y="0" width="248" height="44" rx="10" fill="#fbf1e4" stroke="#e0a869" stroke-width="2"/>
    <text x="124" y="29" font-family="'Noto Sans JP',sans-serif" font-size="19" font-weight="bold" fill="#9a6234" text-anchor="middle">追加料金 一切なし</text>
    <rect x="264" y="0" width="286" height="44" rx="10" fill="#fbf1e4" stroke="#e0a869" stroke-width="2"/>
    <text x="407" y="29" font-family="'Noto Sans JP',sans-serif" font-size="19" font-weight="bold" fill="#9a6234" text-anchor="middle">立ち会い不要・鍵お預かり</text>
  </g>

  <text x="1116" y="600" font-family="'Noto Serif JP',serif" font-size="27" font-weight="bold" fill="#17304a" text-anchor="end">片づけ処 つむぎ</text>

  <!-- 想い出箱 -->
  <g transform="translate(846 212)">
    <ellipse cx="130" cy="252" rx="150" ry="20" fill="#e2d2b8" opacity="0.7"/>
    <g transform="translate(24 -34) rotate(-8)">
      <rect x="0" y="0" width="130" height="26" rx="8" fill="#dda468"/>
    </g>
    <rect x="0" y="14" width="262" height="120" rx="14" fill="#c98d51"/>
    <rect x="0" y="14" width="262" height="22" rx="11" fill="#dda468" opacity="0.6"/>
    <rect x="108" y="14" width="46" height="120" fill="#e9c495" opacity="0.5"/>
    <g transform="translate(58 -136)">
      <rect x="0" y="0" width="146" height="164" rx="10" fill="#ffffff" stroke="#c98d51" stroke-width="6"/>
      <rect x="14" y="14" width="118" height="116" rx="5" fill="#eef3f8"/>
      <circle cx="55" cy="62" r="18" fill="#a9c1d6"/>
      <path d="M30 108 a25 25 0 0 1 50 0 z" fill="#a9c1d6"/>
      <circle cx="96" cy="69" r="13" fill="#e0a869"/>
      <path d="M77 108 a19 19 0 0 1 38 0 z" fill="#e0a869"/>
      <rect x="14" y="108" width="118" height="22" fill="#dbe6ef"/>
    </g>
  </g>
</svg>
