<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-label="施工前後の比較：家財で埋まった和室が、片付いた状態になったイメージ">
  <defs>
    <linearGradient id="c1-wallB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ded5c8"/><stop offset="1" stop-color="#cec3b3"/>
    </linearGradient>
    <linearGradient id="c1-wallA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf8f0"/><stop offset="1" stop-color="#f6efe2"/>
    </linearGradient>
    <clipPath id="c1-pb"><rect x="0" y="34" width="352" height="312" rx="16"/></clipPath>
    <clipPath id="c1-pa"><rect x="408" y="34" width="352" height="312" rx="16"/></clipPath>
  </defs>

  <!-- ===== BEFORE ===== -->
  <g clip-path="url(#c1-pb)">
    <rect x="0" y="34" width="352" height="312" fill="url(#c1-wallB)"/>
    <rect x="0" y="252" width="352" height="94" fill="#b49a78"/>
    <path d="M0 252 h352" stroke="#9d8262" stroke-width="3"/>
    <!-- 窓（カーテン閉じ気味） -->
    <rect x="34" y="72" width="104" height="86" rx="5" fill="#b8bfc4" stroke="#9d9384" stroke-width="4"/>
    <rect x="34" y="72" width="34" height="86" fill="#a79c8c"/>
    <rect x="104" y="72" width="34" height="86" fill="#a79c8c"/>
    <!-- 積み上がった段ボール -->
    <g fill="#c49a63" stroke="#a97f4b" stroke-width="3">
      <rect x="182" y="176" width="80" height="76" rx="4"/>
      <rect x="196" y="120" width="66" height="56" rx="4"/>
      <rect x="262" y="196" width="72" height="56" rx="4"/>
    </g>
    <g stroke="#8f6a3c" stroke-width="3" opacity="0.8">
      <path d="M182 208 h80"/><path d="M196 146 h66"/><path d="M262 220 h72"/>
    </g>
    <!-- 家具・雑多な物 -->
    <rect x="28" y="186" width="66" height="66" rx="4" fill="#a5825c" stroke="#87694a" stroke-width="3"/>
    <path d="M28 214 h66" stroke="#87694a" stroke-width="3"/>
    <circle cx="120" cy="240" r="14" fill="#9fa9b2" stroke="#828d97" stroke-width="3"/>
    <rect x="140" y="228" width="34" height="24" rx="3" fill="#b0b8bd" stroke="#93999e" stroke-width="3"/>
    <g fill="#cdbba0">
      <path d="M96 252 l26 -16 l10 16 z"/><path d="M300 252 l22 -14 l9 14 z"/>
    </g>
    <!-- 散らばった紙 -->
    <g fill="#efe8dc" opacity="0.9">
      <rect x="60" y="264" width="30" height="20" rx="2" transform="rotate(-12 75 274)"/>
      <rect x="216" y="272" width="28" height="18" rx="2" transform="rotate(8 230 281)"/>
      <rect x="288" y="266" width="26" height="18" rx="2" transform="rotate(-6 301 275)"/>
    </g>
    <rect x="0" y="34" width="352" height="312" fill="#5b4b35" opacity="0.13"/>
  </g>
  <rect x="0" y="34" width="352" height="312" rx="16" fill="none" stroke="#d8cdba" stroke-width="2"/>
  <g>
    <rect x="16" y="18" width="106" height="34" rx="17" fill="#6e675e"/>
    <text x="69" y="41" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1.6">BEFORE</text>
  </g>

  <!-- ===== 矢印 ===== -->
  <g transform="translate(380 190)">
    <circle cx="0" cy="0" r="30" fill="#b87a44"/>
    <path d="M-11 0 h20 M2 -9 l10 9 l-10 9" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ===== AFTER ===== -->
  <g clip-path="url(#c1-pa)">
    <rect x="408" y="34" width="352" height="312" fill="url(#c1-wallA)"/>
    <rect x="408" y="252" width="352" height="94" fill="#e6d2ab"/>
    <path d="M408 252 h352" stroke="#d3bd93" stroke-width="3"/>
    <!-- 畳の目 -->
    <g stroke="#d8c49c" stroke-width="2.5">
      <path d="M408 278 h352"/><path d="M408 304 h352"/><path d="M408 330 h352"/>
      <path d="M524 252 v94"/><path d="M644 252 v94"/>
    </g>
    <!-- 窓（開いて光が差す） -->
    <rect x="442" y="72" width="104" height="86" rx="5" fill="#e7f1f8" stroke="#c3b79f" stroke-width="4"/>
    <path d="M494 72 v86" stroke="#c3b79f" stroke-width="4"/>
    <path d="M442 116 h104" stroke="#c3b79f" stroke-width="4"/>
    <!-- 光 -->
    <path d="M442 158 L406 346 L580 346 L546 158 Z" fill="#fbe9c8" opacity="0.55"/>
    <!-- きれいになった床にひとつだけ想い出の箱 -->
    <g transform="translate(628 206)">
      <rect x="0" y="14" width="76" height="46" rx="7" fill="#c98d51"/>
      <rect x="-5" y="2" width="86" height="18" rx="8" fill="#dda468"/>
      <rect x="30" y="14" width="16" height="46" fill="#f0d3ab" opacity="0.75"/>
    </g>
    <ellipse cx="666" cy="270" rx="52" ry="8" fill="#d3bd93" opacity="0.55"/>
  </g>
  <rect x="408" y="34" width="352" height="312" rx="16" fill="none" stroke="#e3d2b3" stroke-width="2"/>
  <g>
    <rect x="424" y="18" width="98" height="34" rx="17" fill="#b87a44"/>
    <text x="473" y="41" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1.6">AFTER</text>
  </g>

  <text x="176" y="368" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="14" fill="#6e675e" text-anchor="middle">家財が残ったままの居間</text>
  <text x="584" y="368" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="14" fill="#6e675e" text-anchor="middle">簡易清掃まで済ませてお引き渡し</text>
</svg>
